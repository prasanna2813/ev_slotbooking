<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVCharge | Manage Stations</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="dashboard-logo">
            ⚡ EVCharge
        </div>


        <nav class="sidebar-nav">

            <a href="admin.html">
                📊 Dashboard
            </a>


            <a href="admin-stations.html" class="active">
                📍 Stations
            </a>


            <a href="bookings.html">
                📅 Bookings
            </a>


            <a href="notifications.html">
                🔔 Notifications
            </a>

        </nav>


        <button
            id="adminLogoutBtn"
            class="logout-btn"
        >
            ↪ Logout
        </button>

    </aside>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="dashboard-main">


        <!-- TOP BAR -->

        <div class="dashboard-topbar">

            <div>

                <p class="welcome-small">
                    EVCHARGE ADMIN
                </p>

                <h1>
                    Station Management
                </h1>

            </div>


            <div class="admin-profile">

                <div class="profile-circle">
                    A
                </div>

            </div>

        </div>



        <!-- =========================
             ADD STATION
        ========================== -->

        <section class="admin-overview-card">


            <div class="admin-section-heading">

                <div>

                    <span>
                        MANAGEMENT
                    </span>

                    <h2>
                        Add Charging Station
                    </h2>

                </div>

            </div>



            <form
                id="stationForm"
                class="admin-station-form"
            >


                <div class="station-form-grid">


                    <!-- STATION NAME -->

                    <div class="admin-form-group">

                        <label for="stationName">
                            Station Name
                        </label>

                        <input
                            type="text"
                            id="stationName"
                            placeholder="Enter station name"
                            required
                        >

                    </div>



                    <!-- ADDRESS -->

                    <div class="admin-form-group">

                        <label for="stationAddress">
                            Address
                        </label>

                        <input
                            type="text"
                            id="stationAddress"
                            placeholder="Enter station address"
                            required
                        >

                    </div>



                    <!-- LATITUDE -->

                    <div class="admin-form-group">

                        <label for="latitude">
                            Latitude
                        </label>

                        <input
                            type="number"
                            step="any"
                            id="latitude"
                            placeholder="13.6288"
                            required
                        >

                    </div>



                    <!-- LONGITUDE -->

                    <div class="admin-form-group">

                        <label for="longitude">
                            Longitude
                        </label>

                        <input
                            type="number"
                            step="any"
                            id="longitude"
                            placeholder="79.4192"
                            required
                        >

                    </div>



                    <!-- TOTAL SLOTS -->

                    <div class="admin-form-group">

                        <label for="totalSlots">
                            Total Slots
                        </label>

                        <input
                            type="number"
                            id="totalSlots"
                            placeholder="10"
                            min="1"
                            required
                        >

                    </div>



                    <!-- AVAILABLE SLOTS -->

                    <div class="admin-form-group">

                        <label for="availableSlots">
                            Available Slots
                        </label>

                        <input
                            type="number"
                            id="availableSlots"
                            placeholder="10"
                            min="0"
                            required
                        >

                    </div>



                    <!-- CHARGING TYPE -->

                    <div class="admin-form-group">

                        <label for="chargingType">
                            Charging Type
                        </label>

                        <select
                            id="chargingType"
                            required
                        >

                            <option value="">
                                Select charging type
                            </option>

                            <option value="Fast Charging">
                                Fast Charging
                            </option>

                            <option value="Normal Charging">
                                Normal Charging
                            </option>

                        </select>

                    </div>



                    <!-- PRICE -->

                    <div class="admin-form-group">

                        <label for="pricePerUnit">
                            Price Per Unit (₹)
                        </label>

                        <input
                            type="number"
                            id="pricePerUnit"
                            placeholder="12"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                </div>



                <!-- ADD BUTTON -->

                <button
                    type="submit"
                    class="admin-login-btn"
                >

                    ➕ Add Station

                </button>


            </form>



            <!-- MESSAGE -->

            <p
                id="stationMessage"
                class="admin-login-message"
            ></p>


        </section>



        <!-- =========================
             ALL STATIONS
        ========================== -->

        <section class="admin-overview-card">


            <div class="admin-section-heading">

                <div>

                    <span>
                        CHARGING NETWORK
                    </span>

                    <h2>
                        All Charging Stations
                    </h2>

                </div>

            </div>



            <div class="table-container">


                <table class="admin-booking-table">


                    <thead>

                        <tr>

                            <th>
                                Station
                            </th>


                            <th>
                                Address
                            </th>


                            <th>
                                Slots
                            </th>


                            <th>
                                Charging
                            </th>


                            <th>
                                Price
                            </th>


                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>



                    <tbody
                        id="stationsTableBody"
                    >

                        <tr>

                            <td colspan="6">
                                Loading stations...
                            </td>

                        </tr>

                    </tbody>


                </table>


            </div>


        </section>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/admin-stations.js"></script>


</body>

</html>
