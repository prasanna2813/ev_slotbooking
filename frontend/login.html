<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVCharge | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- Left Side -->
        <div class="login-brand">

            <div class="login-logo">
                ⚡ EVCharge
            </div>

            <div class="brand-content">
                <span>SMART EV CHARGING</span>

                <h1>
                    Charge smarter.<br>
                    Drive further.
                </h1>

                <p>
                    Find charging stations, reserve your slot
                    and avoid unnecessary waiting.
                </p>
            </div>

        </div>


        <!-- Right Side -->
        <div class="login-form-container">

            <div class="login-form">

                <a href="index.html" class="back-home">
                    ← Back to Home
                </a>

                <h2>Welcome back</h2>

                <p class="login-subtitle">
                    Login to manage your EV charging bookings.
                </p>


                <form id="loginForm">

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-submit"
                    >
                        Login
                    </button>

                </form>


                <p id="loginMessage" class="login-message"></p>


                <div class="register-link">

                    Don't have an account?

                    <a href="register.html">
                        Create account
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
