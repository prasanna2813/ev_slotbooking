<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVCharge | Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- Left Side -->

        <div class="login-brand">

            <div class="login-logo">
                ⚡ EVCharge
            </div>

            <div class="brand-content">

                <span>SMART EV CHARGING</span>

                <h1>
                    Your journey<br>
                    starts here.
                </h1>

                <p>
                    Create your EVCharge account and experience
                    smarter, faster and easier EV charging.
                </p>

            </div>

        </div>


        <!-- Right Side -->

        <div class="login-form-container">

            <div class="login-form">

                <a href="index.html" class="back-home">
                    ← Back to Home
                </a>

                <h2>Create account</h2>

                <p class="login-subtitle">
                    Register to start booking EV charging slots.
                </p>


                <form id="registerForm">

                    <div class="input-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="vehicleNumber">
                            Vehicle Number
                        </label>

                        <input
                            type="text"
                            id="vehicleNumber"
                            placeholder="e.g. APXX1234"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="vehicleModel">
                            Vehicle Model
                        </label>

                        <input
                            type="text"
                            id="vehicleModel"
                            placeholder="e.g. Tata Nexon EV"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="batteryPercentage">
                            Current Battery %
                        </label>

                        <input
                            type="number"
                            id="batteryPercentage"
                            placeholder="e.g. 25"
                            min="0"
                            max="100"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-submit"
                    >
                        Create Account
                    </button>

                </form>


                <p
                    id="registerMessage"
                    class="login-message"
                ></p>


                <div class="register-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
